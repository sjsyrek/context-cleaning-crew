# Dev tooling only. The plugin's scripts are Python 3.9+ standard library, with no dependencies.
[tool.ruff]
target-version = "py39"
line-length = 110
src = ["scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF", "SIM"]

[tool.mypy]
python_version = "3.9"
strict = true
mypy_path = "scripts"
